[package]
name = "latchkey"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A peer-to-peer mesh network secured with post-quantum cryptography, with automatic LAN discovery"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nfelddav/latchkey"
readme = "README.md"
keywords = ["mesh", "p2p", "post-quantum", "ml-kem", "multicast"]
categories = ["network-programming", "cryptography"]

[dependencies]
anyhow = "1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.3", features = ["getrandom", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12.0"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
zeroize = "1"
